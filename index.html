<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Compra Universal</title>
    <style>
        :root {
            --primary: #4f46e5;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: var(--card);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }

        h2 { margin-top: 0; color: var(--primary); text-align: center; }

        .input-group { margin-bottom: 1.2rem; }

        label { display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.9rem; }

        select, input {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
            background-color: white;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        button:hover { background-color: #4338ca; }

        .result {
            margin-top: 1.5rem;
            padding: 1rem;
            background: #f1f5f9;
            border-radius: 8px;
            display: none;
        }

        .result p { margin: 8px 0; font-size: 0.95rem; }
        .highlight { font-weight: bold; color: var(--primary); }
        hr { border: 0; border-top: 1px solid #cbd5e1; margin: 10px 0; }
    </style>
</head>
<body>

<div class="container">
    <h2>Calculadora de Compra</h2>
    
    <div class="input-group">
        <label>Tipo de Medida</label>
        <select id="tipo_medida" onchange="atualizarLabels()">
            <option value="un">Quantidade (Unidades)</option>
            <option value="kg">Peso (Quilos/Kg)</option>
        </select>
    </div>

    <div class="input-group">
        <label id="label_v_orig">Valor Unitário Original (R$)</label>
        <input type="number" id="v_orig" placeholder="0.00" step="0.01">
    </div>

    <div class="input-group">
        <label id="label_qtd">Quantidade de Unidades</label>
        <input type="number" id="qtd" placeholder="Ex: 2 ou 0.500" step="0.001">
    </div>

    <div class="input-group">
        <label id="label_v_desc">Valor Unitário com Desconto (R$)</label>
        <input type="number" id="v_desc" placeholder="0.00" step="0.01">
    </div>

    <button onclick="calcular()">Calcular Resumo</button>

    <div id="resultado" class="result">
        <p>Total sem desconto: <span id="res_bruto" class="highlight"></span></p>
        <p>Total com desconto: <span id="res_liquido" class="highlight"></span></p>
        <hr>
        <p>Economia total: <span id="res_economia" class="highlight"></span></p>
        <p>Desconto aplicado: <span id="res_pct" class="highlight"></span></p>
    </div>
</div>

<script>
    function atualizarLabels() {
        const tipo = document.getElementById('tipo_medida').value;
        const labelVOrig = document.getElementById('label_v_orig');
        const labelQtd = document.getElementById('label_qtd');
        const labelVDesc = document.getElementById('label_v_desc');

        if (tipo === 'kg') {
            labelVOrig.innerText = "Preço por Kg Original (R$)";
            labelQtd.innerText = "Peso Total (Kg)";
            labelVDesc.innerText = "Preço por Kg com Desconto (R$)";
        } else {
            labelVOrig.innerText = "Valor Unitário Original (R$)";
            labelQtd.innerText = "Quantidade de Unidades";
            labelVDesc.innerText = "Valor Unitário com Desconto (R$)";
        }
        // Limpa o resultado ao trocar o tipo para evitar confusão
        document.getElementById('resultado').style.display = 'none';
    }

    function calcular() {
        const v_orig = parseFloat(document.getElementById('v_orig').value);
        const qtd = parseFloat(document.getElementById('qtd').value);
        const v_desc = parseFloat(document.getElementById('v_desc').value);

        if (isNaN(v_orig) || isNaN(qtd) || isNaN(v_desc)) {
            alert("Por favor, preencha todos os campos corretamente.");
            return;
        }

        const total_original = v_orig * qtd;
        const total_com_desconto = v_desc * qtd;
        const desconto_dinheiro = total_original - total_com_desconto;
        const porcentagem = (desconto_dinheiro / total_original) * 100;

        document.getElementById('res_bruto').innerText = `R$ ${total_original.toFixed(2)}`;
        document.getElementById('res_liquido').innerText = `R$ ${total_com_desconto.toFixed(2)}`;
        document.getElementById('res_economia').innerText = `R$ ${desconto_dinheiro.toFixed(2)}`;
        document.getElementById('res_pct').innerText = `${porcentagem.toFixed(2)}%`;

        document.getElementById('resultado').style.display = 'block';
    }
</script>

</body>
</html>
